name: Release

on:
  push:
    branches:
      - "build-test-*"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-client:
    name: Build Client Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create client environment file
        run: |
          # Create the client environment by combining CLI scripts
          echo "# Dnsmasq Web Client environment" > dnsmasq-web.env
          for script in use.sh token.sh curl.sh; do
            tail -n +2 "cli/$script" >> dnsmasq-web.env
          done
          chmod +x dnsmasq-web.env

      - name: Upload Client Environment
        uses: actions/upload-artifact@v4
        with:
          name: client-env
          path: dnsmasq-web.env

  cgo-build:
    strategy:
      matrix:
        targets:
          - 'linux-amd64'
          - 'linux-amd64-musl'
          - 'linux-arm64'
          - 'linux-arm64-musl'
          - 'linux-arm-7'
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6

      - name: Declare version
        run: |
          echo VERSION="$(git describe --tags --always) built $(date +'%a, %d %b %Y %H:%M:%S %Z') by $USER@$HOSTNAME" >> $GITHUB_ENV
  
      - name: Build binaries
        id: cgo-action
        uses: go-cross/cgo-actions@v1
        with:
          flags: -ldflags=-X 'main.Version=${{ env.VERSION }}'
          targets: ${{ matrix.targets }}
          output: $repo-${{ github.ref_name }}_$target$ext

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.targets }}
          path: |
            bin/*-${{ github.ref_name }}_*

  release:
    name: Create Release
    needs: [cgo-build, build-client]
    runs-on: ubuntu-latest
    steps:
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: bin
          pattern: binaries-*
          merge-multiple: true

      - name: Download client environment
        uses: actions/download-artifact@v5
        with:
          name: client-env
          path: .

      - name: Strip binaries with symbols
        run: |
          strip -s bin/*_linux-amd64

      - name: Minify client environment
        run: |
          # Get the latest shfmt release version
          SHFMT_VERSION=$(curl -s https://api.github.com/repos/mvdan/sh/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/') &&
          echo "Downloading shfmt $SHFMT_VERSION" &&
          curl -sLo shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" &&
          chmod +x shfmt &&
          ./shfmt -p -mn dnsmasq-web.env > dnsmasq-web.env.tmp &&
                mv dnsmasq-web.env.tmp dnsmasq-web.env

      - name: Create checksums
        run: |
          cd bin; shasum -a 256 *-${{ github.ref_name }}_* >| ../checksums.txt

      - name: Sign checksums
        run: |
          GPG_TTY=$(tty) gpg -vvv --batch --yes --detach-sign --armor \
            --output checksums.txt.sig \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --pinentry-mode loopback checksums.txt

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes

      - name: Upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            bin/*-${{ github.ref_name }}_* \
            dnsmasq-web.env \
            checksums.txt checksums.txt.sig

