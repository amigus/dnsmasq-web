name: Release

on:
  push:
    branches:
      - "build-test-*"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Declare version
        run: |
            echo BUILD_VERSION="$(git describe --tags --always --dirty) # $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
            echo RELEASE_LABEL="${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build binaries
        run: bash scripts/build.sh release
        env:
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          RELEASE_LABEL: ${{ env.RELEASE_LABEL }}

      - name: Validate artifact set
        run: |
          count=$(find dist/release -maxdepth 1 -type f -name 'dnsmasq-web_*' | wc -l)
          test "$count" -eq 4

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/release/*

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist/release
          name: release-binaries

      - name: Create checksums
        run: |
          cd dist/release; sha256sum dnsmasq-web_* > ../../checksums.txt

      - name: Sign checksums
        run: |
          GPG_TTY=$(tty) gpg -vvv --batch --yes --detach-sign --armor \
            --output checksums.txt.sig \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --pinentry-mode loopback checksums.txt

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes

      - name: Upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/release/* \
            checksums.txt checksums.txt.sig

